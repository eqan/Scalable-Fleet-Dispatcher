services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    env_file: .env.docker
    healthcheck:
      test: "bun -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '4000') + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    env_file: .env.docker
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    env_file: .env.docker
    environment:
      API_HOST: api
      API_PORT: ${PORT:-4000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: arqh_redis
    image: redis:7-alpine
    # Internal-only: reachable by other services as `redis:6379` over the
    # compose network. Not published to the host by default to avoid clashing
    # with a locally-running Redis. Use docker-compose.debug.yml to expose it.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    container_name: arqh_mongo
    image: mongo:7
    # Internal-only: reachable as `mongo:27017` over the compose network.
    # Not published to the host by default (avoids clashing with a local Mongo).
    # Use docker-compose.debug.yml to expose it.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - mongo_data:/data/db

  # ---- Monitoring stack ----

  prometheus:
    image: prom/prometheus:latest
    # Internal-only: scraped/queried by Grafana over the network as
    # `prometheus:9090`. Expose it on the host via docker-compose.debug.yml.
    expose:
      - "9090"
    volumes:
      - ./packages/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    # Internal-only: queried by Grafana as `loki:3100`. Expose on the host via
    # docker-compose.debug.yml if you want to hit the Loki API directly.
    expose:
      - "3100"
    volumes:
      - ./packages/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./packages/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    # The one monitoring UI published to the host. Override with GRAFANA_PORT.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./packages/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
