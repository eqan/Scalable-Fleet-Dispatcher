apiVersion: v1
kind: Service
metadata:
  name: {{ include "dispatch.componentName" (dict "root" . "name" "mongo") }}
  labels:
    {{- include "dispatch.commonLabels" (dict "root" . "name" "mongo" "component" "datastore") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "dispatch.selectorLabels" (dict "root" . "name" "mongo") | nindent 4 }}
  ports:
    - name: mongo
      port: {{ .Values.mongo.service.port }}
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dispatch.componentName" (dict "root" . "name" "mongo") }}
  labels:
    {{- include "dispatch.commonLabels" (dict "root" . "name" "mongo" "component" "datastore") | nindent 4 }}
spec:
  serviceName: {{ include "dispatch.componentName" (dict "root" . "name" "mongo") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dispatch.selectorLabels" (dict "root" . "name" "mongo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dispatch.commonLabels" (dict "root" . "name" "mongo" "component" "datastore") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          ports:
            - name: mongo
              containerPort: {{ .Values.mongo.service.port }}
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext:
            {{- include "dispatch.containerSecurity" (dict "uid" 999) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "dispatch.commonLabels" (dict "root" . "name" "mongo" "component" "datastore") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongo.persistence.size }}
