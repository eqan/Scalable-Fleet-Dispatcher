apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dispatch.componentName" (dict "root" . "name" "api") }}
  labels:
    {{- include "dispatch.commonLabels" (dict "root" . "name" "api" "component" "backend") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dispatch.selectorLabels" (dict "root" . "name" "api") | nindent 6 }}
