{{- if .Values.ingress.enabled }}
# Headers nginx adds to upstream requests after TLS termination.
# Uses proxy-set-headers (not rewrite-target) so /api paths stay intact.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dispatch.componentName" (dict "root" . "name" "ingress-headers") }}
  labels:
    {{- include "dispatch.commonLabels" (dict "root" . "name" "ingress-headers" "component" "proxy") | nindent 4 }}
data:
  X-Forwarded-Proto: "https"
  X-Forwarded-Port: "443"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dispatch.componentName" (dict "root" . "name" "ingress") }}
  labels:
    {{- include "dispatch.commonLabels" (dict "root" . "name" "ingress" "component" "proxy") | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    nginx.ingress.kubernetes.io/proxy-set-headers: {{ printf "%s/%s" .Release.Namespace (include "dispatch.componentName" (dict "root" . "name" "ingress-headers")) | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dispatch.componentName" (dict "root" . "name" "api") }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dispatch.componentName" (dict "root" . "name" "web") }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
