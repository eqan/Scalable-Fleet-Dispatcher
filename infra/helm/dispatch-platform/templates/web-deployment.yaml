apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dispatch.componentName" (dict "root" . "name" "web") }}
  labels:
    {{- include "dispatch.commonLabels" (dict "root" . "name" "web" "component" "proxy") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "dispatch.selectorLabels" (dict "root" . "name" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dispatch.commonLabels" (dict "root" . "name" "web" "component" "proxy") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
          env:
            - name: API_HOST
              value: {{ include "dispatch.componentName" (dict "root" . "name" "api") | quote }}
            - name: API_PORT
              value: {{ .Values.api.service.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "dispatch.containerSecurity" (dict "uid" 101) | nindent 12 }}
