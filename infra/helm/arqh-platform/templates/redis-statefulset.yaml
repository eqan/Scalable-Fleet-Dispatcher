apiVersion: v1
kind: Service
metadata:
  name: {{ include "arqh.componentName" (dict "root" . "name" "redis") }}
  labels:
    {{- include "arqh.commonLabels" (dict "root" . "name" "redis" "component" "datastore") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "arqh.selectorLabels" (dict "root" . "name" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "arqh.componentName" (dict "root" . "name" "redis") }}
  labels:
    {{- include "arqh.commonLabels" (dict "root" . "name" "redis" "component" "datastore") | nindent 4 }}
spec:
  serviceName: {{ include "arqh.componentName" (dict "root" . "name" "redis") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "arqh.selectorLabels" (dict "root" . "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arqh.commonLabels" (dict "root" . "name" "redis" "component" "datastore") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "arqh.containerSecurity" (dict "uid" 999) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "arqh.commonLabels" (dict "root" . "name" "redis" "component" "datastore") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
