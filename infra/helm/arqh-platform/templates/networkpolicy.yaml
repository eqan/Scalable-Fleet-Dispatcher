{{/* Redis/Mongo ← api+worker. API ← Ingress+monitoring. Web ← Ingress. */}}
{{- range $i, $name := list "redis" "mongo" }}
{{- if ne $i 0 }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arqh.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "arqh.commonLabels" (dict "root" $ "name" $name "component" "datastore") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arqh.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "arqh.selectorLabels" (dict "root" $ "name" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "arqh.selectorLabels" (dict "root" $ "name" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ index $.Values $name "service" "port" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arqh.componentName" (dict "root" . "name" "api") }}
  labels:
    {{- include "arqh.commonLabels" (dict "root" . "name" "api" "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arqh.selectorLabels" (dict "root" . "name" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arqh.componentName" (dict "root" . "name" "web") }}
  labels:
    {{- include "arqh.commonLabels" (dict "root" . "name" "web" "component" "proxy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arqh.selectorLabels" (dict "root" . "name" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.web.containerPort }}
