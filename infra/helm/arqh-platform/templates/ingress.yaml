{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "arqh.componentName" (dict "root" . "name" "ingress") }}
  labels:
    {{- include "arqh.commonLabels" (dict "root" . "name" "ingress" "component" "proxy") | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "arqh.componentName" (dict "root" . "name" "api") }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "arqh.componentName" (dict "root" . "name" "web") }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
