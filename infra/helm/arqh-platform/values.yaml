nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  host: arqh.localtest.me
  tls:
    secretName: arqh-local-tls
  # SSE: no buffering + long timeouts. Header rewrites live in ingress.yaml.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"

api:
  replicaCount: 2
  image:
    repository: arqh-api
    tag: local
  containerPort: 4000
  service:
    port: 4000
  pdb:
    minAvailable: 1
  env:
    PORT: "4000"
    ENV: development
    REDIS_DB: "0"
    MONGO_DATABASE: arqh
    RATE_LIMIT_WINDOW_MS: "60000"
    RATE_LIMIT_GENERAL_MAX: "100"
    RATE_LIMIT_MUTATION_MAX: "50"
    REHYDRATION_GUARD_CHECK_MS: "1000"
    SSE_REPLAY_BUFFER_SIZE: "256"
    STATE_READ_VALIDATE: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    startup:
      periodSeconds: 2
      timeoutSeconds: 5
      failureThreshold: 30

worker:
  replicaCount: 1
  image:
    repository: arqh-worker
    tag: local
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

web:
  replicaCount: 1
  image:
    repository: arqh-web
    tag: local
  containerPort: 8080
  service:
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

redis:
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

mongo:
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

secrets:
  REDIS_PASSWORD: ""
  REDIS_USERNAME: ""
  MONGO_USERNAME: ""
  MONGO_PASSWORD: ""
