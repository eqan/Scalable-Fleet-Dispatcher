# Reference-only Promtail config mirroring the Helm values snippets in
# infra/helm/monitoring/values.yaml. The chart renders the live DaemonSet
# config; keep this file in sync when changing K8s log labels.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://monitoring-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kubernetes-pods
    pipeline_stages:
      - cri: {}
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: drop
        source_labels: ["__meta_kubernetes_pod_phase"]
        regex: Pending|Succeeded|Failed|Completed
      - action: replace
        source_labels: ["__meta_kubernetes_namespace"]
        target_label: namespace
      - action: replace
        source_labels: ["__meta_kubernetes_pod_name"]
        target_label: pod
      - action: replace
        source_labels: ["__meta_kubernetes_pod_container_name"]
        target_label: container
      - action: replace
        separator: "-"
        source_labels:
          - "__meta_kubernetes_pod_label_app_kubernetes_io_instance"
          - "__meta_kubernetes_pod_label_app_kubernetes_io_name"
        target_label: app
      - action: replace
        source_labels: ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label: component
      - action: replace
        source_labels: ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator: /
        target_label: __path__
        replacement: /var/log/pods/*$1/*.log
